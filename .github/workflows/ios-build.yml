name: iOS build

# Bygger ordboken på Linux och en osignerad .ipa på en Mac i molnet.
# Sideloadly eller AltStore signerar den med ditt Apple-ID när du installerar.

on:
  push:
    branches: [main, "fas*"]
    # Ändringar som bara rör Windows-appen eller dokumentation bygger inte iOS-appen.
    paths-ignore: ['windows/**', 'docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Låst på Xcode 26.6 så att en ny standard-Xcode på byggservern inte kan höja lägsta iOS över 15.
  # Lämna tomt för byggserverns standard-Xcode. Byt bara till en version som stöder iOS 15.
  XCODE_APP: "/Applications/Xcode_26.6.app"
  # Låst XcodeGen, så att en ny version inte kan ändra projektet utan att något i repot ändrats.
  # Byt bara medvetet, och kontrollera bygget efteråt.
  XCODEGEN_VERSION: "2.46.0"

jobs:
  dictionary:
    name: Ordboken
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Hämta koden
        uses: actions/checkout@v5

      # Källfilerna (cirka 395 MB) laddas ner en gång och sparas, så att Språkbankens och KTH:s
      # servrar inte belastas vid varje bygge. Höj versionen när en källa i build.py byts eller läggs
      # till. Den förra versionen återställs först, så bara de nya filerna laddas ner.
      - name: Källfiler från förra gången
        uses: actions/cache@v4
        with:
          path: tools/dictionary/sources
          key: ordbok-kallor-v2
          restore-keys: ordbok-kallor-

      # Databasen byggs bara om när skripten eller testlistan ändras.
      - name: Färdig ordbok från förra gången
        id: database
        uses: actions/cache@v4
        with:
          path: tools/dictionary/out
          key: ordbok-db-${{ hashFiles('tools/dictionary/*.py', 'tools/dictionary/testwords.txt') }}

      - name: Python
        if: steps.database.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera wordfreq (hur vanliga orden är)
        if: steps.database.outputs.cache-hit != 'true'
        run: python -m pip install wordfreq==3.1.1

      - name: Bygg ordboken
        if: steps.database.outputs.cache-hit != 'true'
        run: python tools/dictionary/build.py

      - name: Sammanfattning av testlistan
        run: |
          sed -n '/^Svenska:/,/^Uppslag/p' tools/dictionary/out/testrapport.txt
          ls -lh tools/dictionary/out/

      - name: Ladda upp ordboken till appbygget
        uses: actions/upload-artifact@v4
        with:
          name: ordbok
          path: tools/dictionary/out/lasa-ordbok.sqlite
          retention-days: 7

      - name: Ladda upp testrapporten
        uses: actions/upload-artifact@v4
        with:
          name: Ordbok-testrapport
          path: tools/dictionary/out/testrapport.txt
          retention-days: 30

  build:
    name: Appen
    needs: dictionary
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Hämta koden
        uses: actions/checkout@v5

      - name: Hämta ordboken
        uses: actions/download-artifact@v4
        with:
          name: ordbok
          path: App/Resources

      - name: Välj Xcode
        run: |
          if [ -n "$XCODE_APP" ] && [ -d "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version

      - name: Installera XcodeGen (låst version)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          rm -rf "$RUNNER_TEMP/xcodegen"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          XCODEGEN=$(find "$RUNNER_TEMP/xcodegen" -type f -path '*/bin/xcodegen' | head -n 1)
          test -n "$XCODEGEN"
          chmod +x "$XCODEGEN"
          dirname "$XCODEGEN" >> "$GITHUB_PATH"
          "$XCODEGEN" --version

      - name: Generera Xcode-projektet
        run: |
          ls -lh App/Resources
          xcodegen generate

      - name: Bygg utan signering
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project Lasa.xcodeproj \
            -scheme Lasa \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Lasa.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log

      - name: Visa kompileringsfel
        if: failure()
        run: |
          echo "Rader med fel i bygget:"
          grep -n -E "error:|fatal error" build/xcodebuild.log | head -n 80 || echo "Inga rader med 'error:' hittades."

      - name: Kontrollera att ordboken finns i appen
        run: |
          ls -lh build/Lasa.xcarchive/Products/Applications/Lasa.app/lasa-ordbok.sqlite

      - name: Packa .ipa
        run: |
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R build/Lasa.xcarchive/Products/Applications/Lasa.app build/Payload/
          cd build
          zip -qry Lasa-unsigned.ipa Payload
          ls -lh Lasa-unsigned.ipa

      - name: Ladda upp .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Lasa-ipa
          path: build/Lasa-unsigned.ipa
          retention-days: 30

      # Filerna som översätter adresserna i en kraschrapport (MetricKit) till funktioner och rader.
      - name: Ladda upp dSYM
        uses: actions/upload-artifact@v4
        with:
          name: Lasa-dSYM
          path: build/Lasa.xcarchive/dSYMs
          retention-days: 30
          if-no-files-found: warn

      - name: Ladda upp bygglogg
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bygglogg
          path: build/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore

  # Kör appen i en iPad-simulator med testböcker (EPUB, Markdown, txt, RTF). Appens självtest bläddrar,
  # slår upp ett ord, byter typsnitt och tema och sparar bilder och en logg i artefakten Simulatortest.
  # Simulatorn har en nyare iOS än iPaden, så det som beror på iOS 15 testas fortfarande på iPaden.
  simulator:
    name: Simulatortest
    needs: dictionary
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Hämta koden
        uses: actions/checkout@v5

      - name: Hämta ordboken
        uses: actions/download-artifact@v4
        with:
          name: ordbok
          path: App/Resources

      - name: Välj Xcode
        run: |
          if [ -n "$XCODE_APP" ] && [ -d "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version

      - name: Installera XcodeGen (låst version)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          rm -rf "$RUNNER_TEMP/xcodegen"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          XCODEGEN=$(find "$RUNNER_TEMP/xcodegen" -type f -path '*/bin/xcodegen' | head -n 1)
          test -n "$XCODEGEN"
          chmod +x "$XCODEGEN"
          dirname "$XCODEGEN" >> "$GITHUB_PATH"
          "$XCODEGEN" --version

      - name: Kör självtestet i simulatorn
        run: bash tools/simtest/run.sh

      - name: Ladda upp resultatet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Simulatortest
          path: build/simtest
          retention-days: 14
          if-no-files-found: ignore
