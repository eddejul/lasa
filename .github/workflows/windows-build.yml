name: Windows build

# Bygger ordboken på Linux (samma jobb och cache som iOS-bygget) och Windows-appen (Tauri) på en
# Windows-maskin i molnet. Installationsfilerna läggs i artefakten Lasa-windows.

on:
  push:
    branches: [main, "fas*"]
    paths:
      - "windows/**"
      - "tools/dictionary/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dictionary:
    name: Ordboken
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Hämta koden
        uses: actions/checkout@v5

      # Samma steg och cachenycklar som jobbet Ordboken i ios-build.yml, så att databasen bara byggs
      # en gång per version av skripten.
      - name: Källfiler från förra gången
        uses: actions/cache@v4
        with:
          path: tools/dictionary/sources
          key: ordbok-kallor-v2
          restore-keys: ordbok-kallor-

      - name: Färdig ordbok från förra gången
        id: database
        uses: actions/cache@v4
        with:
          path: tools/dictionary/out
          key: ordbok-db-${{ hashFiles('tools/dictionary/*.py', 'tools/dictionary/testwords.txt') }}

      - name: Python
        if: steps.database.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera wordfreq (hur vanliga orden är)
        if: steps.database.outputs.cache-hit != 'true'
        run: python -m pip install wordfreq==3.1.1

      - name: Bygg ordboken
        if: steps.database.outputs.cache-hit != 'true'
        run: python tools/dictionary/build.py

      - name: Sammanfattning av testlistan
        run: |
          sed -n '/^Svenska:/,/^Uppslag/p' tools/dictionary/out/testrapport.txt
          ls -lh tools/dictionary/out/

      - name: Ladda upp ordboken till appbygget
        uses: actions/upload-artifact@v4
        with:
          name: ordbok
          path: tools/dictionary/out/lasa-ordbok.sqlite
          retention-days: 7

      - name: Ladda upp testrapporten
        uses: actions/upload-artifact@v4
        with:
          name: Ordbok-testrapport
          path: tools/dictionary/out/testrapport.txt
          retention-days: 30

  # Uppslagslogiken finns i tre kopior. Den i Windows-appen (lookup.js) ska ge samma svar som lookup.py.
  parity:
    name: Paritetstest
    needs: dictionary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Hämta koden
        uses: actions/checkout@v5

      - name: Hämta ordboken
        uses: actions/download-artifact@v4
        with:
          name: ordbok
          path: build/ordbok

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: lookup.js mot lookup.py över testlistan, och enhetstesterna (ordreglerna, textfilerna, repetitionen)
        run: |
          node --no-warnings windows/tests/parity.mjs build/ordbok/lasa-ordbok.sqlite tools/dictionary/testwords.txt python3
          node --test windows/tests/*.test.mjs

  build:
    name: Appen för Windows
    needs: dictionary
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: windows

    steps:
      - name: Hämta koden
        uses: actions/checkout@v5

      - name: Hämta ordboken
        uses: actions/download-artifact@v4
        with:
          name: ordbok
          path: windows/src-tauri/resources

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Rust
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "windows/src-tauri -> target"

      - name: Installera Tauris verktyg (låsta versioner)
        run: npm ci

      - name: Bygg appen och installationsfilerna
        run: |
          ls -lh src-tauri/resources
          npx tauri build

      - name: Visa installationsfilerna
        run: |
          ls -lh src-tauri/target/release/bundle/nsis/ src-tauri/target/release/bundle/msi/
          ls -lh src-tauri/target/release/lasa.exe

      - name: Ladda upp installationsfilerna
        uses: actions/upload-artifact@v4
        with:
          name: Lasa-windows
          path: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      # Cargo.lock skapas i bygget (det finns ingen Rust på utvecklingsdatorn). Den laddas upp så att
      # den kan checkas in och låsa alla beroenden.
      - name: Ladda upp Cargo.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cargo-lock
          path: windows/src-tauri/Cargo.lock
          if-no-files-found: ignore
          retention-days: 7
