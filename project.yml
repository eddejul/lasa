name: Lasa

options:
  bundleIdPrefix: se.edvin
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: sv

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  Lasa:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: App
    settings:
      base:
        PRODUCT_NAME: Lasa
        PRODUCT_BUNDLE_IDENTIFIER: se.edvin.lasa
        INFOPLIST_FILE: Config/Info.plist
        # Appikonen (U8) ligger i App/Assets.xcassets. Visningsnamnet Sensus står i Info.plist,
        # bundle-id och produktnamn är oförändrade så att appen ersätter den gamla.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"

  # Automatiska tester av ren logik (G13). Körs i jobbet Simulatortest, aldrig i arkivet.
  LasaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests/LasaTests
    dependencies:
      - target: Lasa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.edvin.lasa.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lasa.app/Lasa"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Lasa:
    build:
      targets:
        Lasa: all
        LasaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LasaTests
    archive:
      config: Release
